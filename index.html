<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hauntings in Virginia</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header>
    <h1>Hauntings in Virginia</h1>
  </header>

  <main>
    <h2>Get in Touch</h2>

    <p>
      Have you experienced something unexplained in Virginia? 
      Tell us about a haunted location, paranormal experience, 
      or investigation you would like to share.
    </p>

    <form action="https://formspree.io/f/your-form-id" method="post">

      <label for="name">Name</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="phone">Phone</label>
      <input type="tel" id="phone" name="phone">

      <p>What are you contacting us about?</p>

      <label for="location">Haunted Location</label>
      <input type="radio" id="location" name="contact-type" value="location" checked>

      <label for="experience">Paranormal Experience</label>
      <input type="radio" id="experience" name="contact-type" value="experience">

      <label for="newsletter">
        Email me about new haunted locations and investigations
      </label>
      <input type="checkbox" id="newsletter" name="newsletter">

      <label for="message">
        Tell us about your experience or location
      </label>

      <textarea id="message" name="message" required></textarea>

      <button type="submit">Send Your Story</button>

    </form>
  </main>

  <footer>
    <p>&copy; 2026 Hauntings in Virginia</p>
  </footer>

</body>
</html>
